services:
  keygen:
    build:
      context: .
      dockerfile: scripts/keygen.Dockerfile
    volumes:
      - jwt_keys:/run/secrets/jwt

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service/migrations:/migrations/auth
      - ./services/room-service/migrations:/migrations/room
      - ./services/availability-service/migrations:/migrations/availability
      - ./services/booking-service/migrations:/migrations/booking
      - ./scripts/run-migrations.sh:/run-migrations.sh
    entrypoint: ["sh", "/run-migrations.sh"]

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/auth_db?sslmode=disable"
      JWT_PRIVATE_KEY_PATH: "/run/secrets/jwt/private.pem"
      TEST_TASK_MODE: "${TEST_TASK_MODE:-false}"
    volumes:
      - jwt_keys:/run/secrets/jwt:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/_health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  room-service:
    build:
      context: .
      dockerfile: services/room-service/Dockerfile
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/room_db?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/_health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  availability-service:
    build:
      context: .
      dockerfile: services/availability-service/Dockerfile
    environment:
      PORT: "8083"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/availability_db?sslmode=disable"
      ROOM_SERVICE_URL: "http://room-service:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      room-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/_health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    environment:
      PORT: "8084"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/booking_db?sslmode=disable"
      AVAILABILITY_SERVICE_URL: "http://availability-service:8083"
      CONFERENCE_SERVICE_URL: "http://conference-mock-service:8085"
    depends_on:
      migrate:
        condition: service_completed_successfully
      availability-service:
        condition: service_healthy
      conference-mock-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/_health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  conference-mock-service:
    build:
      context: .
      dockerfile: services/conference-mock-service/Dockerfile
    environment:
      PORT: "8085"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/_health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      JWT_PUBLIC_KEY_PATH: "/run/secrets/jwt/public.pem"
      TEST_TASK_MODE: "${TEST_TASK_MODE:-false}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      ROOM_SERVICE_URL: "http://room-service:8082"
      AVAILABILITY_SERVICE_URL: "http://availability-service:8083"
      BOOKING_SERVICE_URL: "http://booking-service:8084"
    volumes:
      - jwt_keys:/run/secrets/jwt:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      availability-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/_info"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  jwt_keys:
